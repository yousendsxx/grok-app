name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Unzip Workspace & Build
        run: |
          # Sıkıştırılmış zip dosyasını tespit et ve çıkar
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Zip dosyası bulundu: $ZIP_FILE. Çıkarılıyor..."
            unzip -o "$ZIP_FILE" -d extracted_project
            cd extracted_project
          fi

          # Proje alt klasörde kalmışsa klasörün içine geç
          PACKAGE_PATH=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$PACKAGE_PATH" ]; then
            echo "HATA: Zip içinde package.json bulunamadı!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PACKAGE_PATH")
          echo "Proje dizinine geçiliyor: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Bağımlılıkları yükle ve derle
          npm install --legacy-peer-deps
          npm run build
          
          # Derleme çıktı klasörünü otomatik belirle
          BUILD_DIR="dist"
          if [ -d "build" ]; then BUILD_DIR="build"; fi
          if [ -d "out" ]; then BUILD_DIR="out"; fi
          
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init GrokApp com.grok.app --web-dir $BUILD_DIR
          fi
          
          npx cap add android || true
          npx cap sync android
          
          # Android APK çıktısı alma
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok-apk
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
